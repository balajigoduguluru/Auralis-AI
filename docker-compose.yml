version: '3.8'
services:
  web:
    build:
      context: .
      args:
        VITE_OPENWEATHER_API_KEY: ${VITE_OPENWEATHER_API_KEY}
        VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY}
        VITE_EMAILJS_SERVICE_ID: ${VITE_EMAILJS_SERVICE_ID}
        VITE_EMAILJS_NOTIFICATION_TEMPLATE_ID: ${VITE_EMAILJS_NOTIFICATION_TEMPLATE_ID}
        VITE_EMAILJS_AUTOREPLY_TEMPLATE_ID: ${VITE_EMAILJS_AUTOREPLY_TEMPLATE_ID}
        VITE_EMAILJS_PUBLIC_KEY: ${VITE_EMAILJS_PUBLIC_KEY}
        VITE_ADMIN_SECRET: ${VITE_ADMIN_SECRET}
    ports:
      - "3000:80"
    restart: unless-stopped